<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex — Appointment Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,400&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0D1B2E;
  --bg2: #0A1628;
  --surface: #112240;
  --surface2: #162D4E;
  --border: rgba(148,190,255,0.1);
  --border2: rgba(148,190,255,0.06);
  --gold: #5BADFF;
  --gold-dim: rgba(91,173,255,0.12);
  --gold-glow: rgba(91,173,255,0.28);
  --cream: #E8F1FF;
  --cream-dim: rgba(232,241,255,0.65);
  --cream-mute: rgba(232,241,255,0.32);
  --cream-ghost: rgba(232,241,255,0.07);
  --teal: #4ED9C0;
  --teal-dim: rgba(78,217,192,0.12);
  --rose: #FF6B7A;
  --rose-dim: rgba(255,107,122,0.12);
  --amber: #FFB347;
  --amber-dim: rgba(255,179,71,0.12);
  --lavender: #A78BFA;
  --lavender-dim: rgba(167,139,250,0.12);
  --sidebar-w: 260px;
  --radius: 16px;
  --radius-lg: 22px;
  --shadow: 0 4px 24px rgba(0,0,0,0.35);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.45);
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Instrument Sans', sans-serif;
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--cream);
  min-height: 100vh;
  overflow-x: hidden;
  font-size: 15px;
  letter-spacing: 0.01em;
  line-height: 1.5;
}

/* Subtle radial glow top-left */
body::after {
  content: '';
  position: fixed;
  top: -200px; left: -200px;
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(91,173,255,0.07) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* Grain */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 1000;
}

.shell { display: flex; min-height: 100vh; }

/* ---- SIDEBAR ---- */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  position: fixed;
  top: 0; left: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  padding: 28px 0;
  z-index: 100;
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
}

.sidebar-logo {
  padding: 0 24px 32px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo-icon {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, #5BADFF, #2C7FD4);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 1.1rem;
  color: white;
  flex-shrink: 0;
  box-shadow: 0 4px 16px rgba(91,173,255,0.35);
}
.logo-text {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.3rem;
  color: var(--cream);
  letter-spacing: -0.03em;
}
.logo-text span { color: var(--gold); }

.sidebar-section {
  padding: 0 14px;
  margin-bottom: 6px;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--cream-mute);
  padding-left: 20px;
  margin-top: 12px;
  margin-bottom: 6px;
}

.sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 0 12px; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-radius: 12px;
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--cream-mute);
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  user-select: none;
}
.nav-item i { width: 18px; font-size: 0.9rem; flex-shrink: 0; opacity: 0.7; transition: opacity 0.2s; }
.nav-item .badge {
  margin-left: auto;
  background: var(--rose);
  color: white;
  font-size: 0.62rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 20px;
  min-width: 20px;
  text-align: center;
}
.nav-item:hover { color: var(--cream); background: var(--cream-ghost); }
.nav-item:hover i { opacity: 1; }
.nav-item.active {
  background: var(--gold-dim);
  color: var(--gold);
  font-weight: 600;
  border: 1px solid rgba(212,168,83,0.18);
}
.nav-item.active i { opacity: 1; color: var(--gold); }
.nav-item.active::before {
  content: '';
  position: absolute;
  left: -12px;
  top: 50%; transform: translateY(-50%);
  width: 3px;
  height: 20px;
  background: var(--gold);
  border-radius: 0 3px 3px 0;
}

.sidebar-footer {
  padding: 20px 20px 0;
  border-top: 1px solid var(--border);
  margin-top: 12px;
}
.sidebar-user {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  border-radius: 12px;
  cursor: pointer;
  transition: background 0.2s;
}
.sidebar-user:hover { background: var(--cream-ghost); }
.user-avatar {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--teal), var(--lavender));
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  color: white;
  font-size: 0.85rem;
  flex-shrink: 0;
}
.user-name { font-size: 0.875rem; font-weight: 600; color: var(--cream); }
.user-role { font-size: 0.72rem; color: var(--cream-mute); margin-top: 1px; }
.user-chevron { margin-left: auto; color: var(--cream-mute); font-size: 0.7rem; }

/* ---- MAIN ---- */
.main { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-height: 100vh; }

/* ---- TOPBAR ---- */
.topbar {
  height: 68px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 28px;
  position: sticky;
  top: 0;
  z-index: 90;
  backdrop-filter: blur(20px);
}
.topbar-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
.hamburger {
  display: none;
  width: 38px; height: 38px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--cream-dim);
  align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 1rem;
  transition: all 0.2s;
  flex-shrink: 0;
}
.hamburger:hover { color: var(--cream); border-color: var(--gold); }

.search-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  height: 42px;
  transition: all 0.2s;
  max-width: 340px;
  width: 100%;
}
.search-wrap:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); }
.search-wrap i { color: var(--cream-mute); font-size: 0.8rem; flex-shrink: 0; }
.search-wrap input {
  border: none; outline: none;
  background: transparent;
  font-family: var(--font-body);
  font-size: 0.875rem;
  color: var(--cream);
  width: 100%;
}
.search-wrap input::placeholder { color: var(--cream-mute); }

.topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.icon-btn {
  width: 40px; height: 40px;
  border-radius: 11px;
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  color: var(--cream-dim);
  font-size: 0.95rem;
}
.icon-btn:hover { border-color: var(--gold); color: var(--gold); }
.notif-dot {
  position: absolute;
  top: 8px; right: 8px;
  width: 7px; height: 7px;
  background: var(--rose);
  border-radius: 50%;
  border: 2px solid var(--bg);
  animation: ping 2s infinite;
}
@keyframes ping {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.7; }
}

.book-btn {
  background: linear-gradient(135deg, #5BADFF, #2C7FD4);
  color: white;
  border: none;
  padding: 0 18px;
  height: 42px;
  border-radius: 12px;
  font-family: var(--font-body);
  font-size: 0.875rem;
  font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  transition: all 0.2s;
  white-space: nowrap;
  letter-spacing: 0.01em;
}
.book-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px var(--gold-glow); filter: brightness(1.1); }
.book-btn i { font-size: 0.8rem; }

/* ---- CONTENT ---- */
.content { padding: 28px; flex: 1; max-width: 1400px; width: 100%; }

/* ---- PAGE HEADER ---- */
.page-header {
  margin-bottom: 28px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
}
.page-title {
  font-family: var(--font-display);
  font-size: 1.9rem;
  font-weight: 700;
  color: var(--cream);
  letter-spacing: -0.03em;
  line-height: 1.15;
}
.page-title span { color: var(--gold); }
.page-sub { font-size: 0.82rem; color: var(--cream-mute); margin-top: 4px; }

/* ---- KPI CARDS ---- */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}

.kpi-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 22px;
  border: 1px solid var(--border);
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
  animation: fadeUp 0.5s both;
}
.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent-col, var(--gold)), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}
.kpi-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: rgba(255,255,255,0.12); }
.kpi-card:hover::before { opacity: 1; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
.kpi-card:nth-child(1){animation-delay:0.05s} .kpi-card:nth-child(2){animation-delay:0.1s}
.kpi-card:nth-child(3){animation-delay:0.15s} .kpi-card:nth-child(4){animation-delay:0.2s}

.kpi-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
.kpi-icon {
  width: 42px; height: 42px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
}
.kpi-change {
  font-size: 0.72rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 4px 9px;
  border-radius: 20px;
}
.kpi-change.up { background: var(--teal-dim); color: var(--teal); }
.kpi-change.neutral { background: var(--amber-dim); color: var(--amber); }
.kpi-change.down { background: var(--rose-dim); color: var(--rose); }

.kpi-num {
  font-family: var(--font-display);
  font-size: 2.2rem;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.04em;
  color: var(--cream);
  margin-bottom: 4px;
}
.kpi-label { font-size: 0.8rem; color: var(--cream-mute); font-weight: 500; }

/* ---- TWO COL ---- */
.two-col { display: grid; grid-template-columns: 1fr 340px; gap: 20px; margin-bottom: 28px; }

/* ---- CARD ---- */
.card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  overflow: hidden;
  animation: fadeUp 0.4s both;
}
.card-head {
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border2);
}
.card-head-title {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 600;
  color: var(--cream);
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.card-head-title i { color: var(--gold); font-size: 0.85rem; }
.card-head-action {
  font-size: 0.75rem;
  color: var(--gold);
  font-weight: 600;
  cursor: pointer;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid rgba(212,168,83,0.2);
  transition: all 0.2s;
  background: transparent;
}
.card-head-action:hover { background: var(--gold-dim); }

/* Appointment row */
.app-row {
  padding: 14px 22px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid var(--border2);
  transition: background 0.15s;
}
.app-row:last-child { border-bottom: none; }
.app-row:hover { background: var(--cream-ghost); }

.app-avatar {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.82rem;
  flex-shrink: 0;
  color: white;
}
.app-info { flex: 1; min-width: 0; }
.app-name { font-weight: 600; font-size: 0.875rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--cream); }
.app-service { font-size: 0.75rem; color: var(--cream-mute); margin-top: 1px; }
.app-meta { text-align: right; flex-shrink: 0; }
.app-time { font-size: 0.8rem; font-weight: 600; color: var(--cream-dim); }
.app-date { font-size: 0.7rem; color: var(--cream-mute); margin-top: 1px; }

/* Status pill */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.pill::before { content: ''; width: 5px; height: 5px; border-radius: 50%; }
.pill.confirmed { background: var(--teal-dim); color: var(--teal); border: 1px solid rgba(63,191,168,0.2); }
.pill.confirmed::before { background: var(--teal); }
.pill.pending { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(232,168,74,0.2); }
.pill.pending::before { background: var(--amber); }
.pill.cancelled { background: var(--rose-dim); color: var(--rose); border: 1px solid rgba(232,96,74,0.2); }
.pill.cancelled::before { background: var(--rose); }

/* ---- SERVICE MIX ---- */
.stat-mini {
  padding: 14px 22px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid var(--border2);
}
.stat-mini:last-child { border-bottom: none; }
.stat-mini-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; flex-shrink: 0; }
.stat-mini-val { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
.stat-mini-lbl { font-size: 0.72rem; color: var(--cream-mute); margin-top: 2px; }
.stat-mini-bar { flex: 1; height: 3px; background: var(--border); border-radius: 4px; overflow: hidden; }
.stat-mini-bar-fill { height: 100%; border-radius: 4px; transition: width 1.2s cubic-bezier(0.4,0,0.2,1); }

/* ---- TABLE ---- */
.table-wrap {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  overflow: hidden;
  animation: fadeUp 0.5s 0.2s both;
}
.data-table { width: 100%; border-collapse: collapse; }
.data-table th {
  padding: 13px 20px;
  text-align: left;
  font-family: var(--font-body);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--cream-mute);
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.data-table td { padding: 14px 20px; font-size: 0.875rem; border-bottom: 1px solid var(--border2); vertical-align: middle; color: var(--cream-dim); }
.data-table tr:last-child td { border-bottom: none; }
.data-table tbody tr { transition: background 0.15s; }
.data-table tbody tr:hover td { background: var(--cream-ghost); }
.td-primary { font-weight: 600; color: var(--cream); }
.td-sub { font-size: 0.7rem; color: var(--cream-mute); margin-top: 2px; }

.action-btn {
  width: 32px; height: 32px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: transparent;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
  font-size: 0.78rem;
  color: var(--cream-mute);
}
.action-btn:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
.action-btn.del:hover { border-color: var(--rose); color: var(--rose); background: var(--rose-dim); }

/* ---- MODAL ---- */
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-box {
  background: var(--surface);
  border-radius: 28px;
  width: 100%;
  max-width: 500px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
  animation: modalIn 0.28s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes modalIn { from{opacity:0;transform:scale(0.88)translateY(20px)} to{opacity:1;transform:scale(1)translateY(0)} }

.modal-header {
  padding: 26px 26px 20px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}
.modal-title {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--cream);
  letter-spacing: -0.03em;
}
.modal-sub { font-size: 0.78rem; color: var(--cream-mute); margin-top: 3px; }
.modal-close {
  width: 34px; height: 34px;
  border-radius: 9px;
  background: var(--cream-ghost);
  border: 1px solid var(--border);
  color: var(--cream-mute);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem;
  transition: all 0.2s;
  flex-shrink: 0;
}
.modal-close:hover { color: var(--cream); background: var(--border); }

.modal-body { padding: 22px 26px 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: 1/-1; }
.form-group label { font-size: 0.7rem; font-weight: 700; color: var(--cream-mute); letter-spacing: 0.08em; text-transform: uppercase; }
.form-group input, .form-group select, .form-group textarea {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 10px 13px;
  font-family: var(--font-body);
  font-size: 0.875rem;
  color: var(--cream);
  width: 100%;
  transition: all 0.2s;
}
.form-group select option { background: var(--surface); }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: var(--gold);
  box-shadow: 0 0 0 3px var(--gold-dim);
}
.form-group textarea { resize: vertical; min-height: 70px; }
.modal-submit {
  grid-column: 1/-1;
  background: linear-gradient(135deg, #5BADFF, #2C7FD4);
  color: white;
  border: none;
  padding: 13px;
  border-radius: 12px;
  font-family: var(--font-body);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.02em;
  margin-top: 4px;
}
.modal-submit:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 8px 24px var(--gold-glow); }

/* ---- MINI CALENDAR ---- */
.mini-cal { padding: 18px 22px; }
.mini-cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.mini-cal-title { font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; color: var(--cream); }
.mini-cal-nav { display: flex; gap: 4px; }
.cal-nav-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); background: transparent; cursor: pointer; font-size: 0.68rem; color: var(--cream-mute); display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.cal-nav-btn:hover { border-color: var(--gold); color: var(--gold); }
.mini-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-day-name { text-align: center; font-size: 0.6rem; font-weight: 700; color: var(--cream-mute); padding: 4px 0; text-transform: uppercase; letter-spacing: 0.05em; }
.cal-day { text-align: center; font-size: 0.72rem; padding: 6px 2px; border-radius: 7px; cursor: pointer; transition: all 0.15s; position: relative; color: var(--cream-dim); }
.cal-day:hover { background: var(--cream-ghost); }
.cal-day.has-apt::after { content:''; position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:4px; height:4px; background: var(--gold); border-radius:50%; }
.cal-day.today { background: #5BADFF; color: white; font-weight: 700; }
.cal-day.other-month { opacity: 0.2; }

/* ---- ANALYTICS ---- */
.chart-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
.chart-card { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); overflow: hidden; }
.chart-body { padding: 20px 22px; }

/* ---- CLIENTS ---- */
.clients-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 16px; }
.client-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  padding: 22px;
  text-align: center;
  transition: all 0.25s;
  animation: fadeUp 0.4s both;
}
.client-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: rgba(255,255,255,0.12); }
.client-avatar { width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 1.1rem; font-weight: 800; color: white; }
.client-name { font-family: var(--font-display); font-weight: 700; font-size: 1rem; margin-bottom: 3px; color: var(--cream); }
.client-email { font-size: 0.72rem; color: var(--cream-mute); margin-bottom: 10px; word-break: break-all; }
.client-service-tag { display: inline-block; background: var(--cream-ghost); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 0.7rem; font-weight: 600; color: var(--cream-dim); margin-bottom: 10px; }

/* ---- MESSAGES ---- */
.msg-wrap { display: grid; gap: 12px; }
.msg-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start; transition: all 0.2s; }
.msg-card:hover { border-color: var(--gold); box-shadow: 0 4px 20px var(--gold-dim); }
.msg-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
.msg-content h4 { font-weight: 600; margin-bottom: 3px; font-size: 0.9rem; color: var(--cream); }
.msg-content p { font-size: 0.8rem; color: var(--cream-mute); }
.msg-time { margin-left: auto; font-size: 0.7rem; color: var(--cream-mute); flex-shrink: 0; padding-top: 2px; }

/* ---- SETTINGS ---- */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.setting-card { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 24px; }
.setting-card h3 { font-family: var(--font-display); font-weight: 700; margin-bottom: 18px; font-size: 1rem; display: flex; align-items: center; gap: 10px; color: var(--cream); letter-spacing: -0.02em; }
.setting-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border2); }
.setting-row:last-child { border-bottom: none; }
.setting-label { font-size: 0.875rem; font-weight: 500; color: var(--cream-dim); }
.setting-desc { font-size: 0.72rem; color: var(--cream-mute); margin-top: 2px; }
.toggle { width: 42px; height: 23px; background: var(--border); border-radius: 12px; position: relative; cursor: pointer; transition: background 0.25s; flex-shrink: 0; }
.toggle.on { background: var(--gold); }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: white; transition: left 0.25s; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
.toggle.on::after { left: 22px; }

/* ---- FILTER BAR ---- */
.filter-bar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.filter-input {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 9px 14px;
  font-family: var(--font-body);
  font-size: 0.875rem;
  color: var(--cream);
  transition: all 0.2s;
}
.filter-input::placeholder { color: var(--cream-mute); }
.filter-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); }

/* ---- TOAST NOTIFICATIONS ---- */
.toast-container {
  position: fixed;
  bottom: 24px; right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}
.toast {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 280px;
  max-width: 360px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
  transform: translateX(calc(100% + 30px));
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events: auto;
}
.toast.show { transform: translateX(0); opacity: 1; }
.toast.hiding { transform: translateX(calc(100% + 30px)); opacity: 0; transition: all 0.3s ease; }

.toast-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.95rem;
  flex-shrink: 0;
}
.toast.success .toast-icon { background: var(--teal-dim); color: var(--teal); }
.toast.error .toast-icon { background: var(--rose-dim); color: var(--rose); }
.toast.warning .toast-icon { background: var(--amber-dim); color: var(--amber); }
.toast.info .toast-icon { background: var(--gold-dim); color: var(--gold); }

.toast-left-bar {
  position: absolute;
  left: 0; top: 8px; bottom: 8px;
  width: 3px;
  border-radius: 0 3px 3px 0;
}
.toast.success .toast-left-bar { background: var(--teal); }
.toast.error .toast-left-bar { background: var(--rose); }
.toast.warning .toast-left-bar { background: var(--amber); }
.toast.info .toast-left-bar { background: var(--gold); }

.toast-text { flex: 1; min-width: 0; }
.toast-title { font-weight: 700; font-size: 0.85rem; color: var(--cream); margin-bottom: 2px; }
.toast-msg { font-size: 0.78rem; color: var(--cream-mute); }
.toast-close {
  background: none; border: none;
  color: var(--cream-mute);
  cursor: pointer;
  font-size: 0.75rem;
  padding: 4px;
  border-radius: 6px;
  transition: color 0.2s;
  flex-shrink: 0;
}
.toast-close:hover { color: var(--cream); }

.toast-progress {
  position: absolute;
  bottom: 0; left: 0;
  height: 2px;
  border-radius: 0 0 14px 14px;
  animation: toastProgress 3s linear forwards;
}
.toast.success .toast-progress { background: var(--teal); }
.toast.error .toast-progress { background: var(--rose); }
.toast.warning .toast-progress { background: var(--amber); }
.toast.info .toast-progress { background: var(--gold); }
@keyframes toastProgress { from { width: 100%; } to { width: 0%; } }

/* ---- SIDEBAR OVERLAY ---- */
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 99; backdrop-filter: blur(3px); }

/* ---- EMPTY STATE ---- */
.empty-state { text-align: center; padding: 48px 20px; }
.empty-state i { font-size: 2.5rem; color: var(--cream-mute); margin-bottom: 12px; display: block; }
.empty-state p { color: var(--cream-mute); font-size: 0.875rem; }

/* ---- SEC TITLE ---- */
.sec-title {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--cream);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: -0.02em;
}
.sec-title-line { width: 20px; height: 2px; background: var(--gold); border-radius: 2px; flex-shrink: 0; }

/* ---- RESPONSIVE ---- */
@media (max-width: 1200px) {
  .kpi-grid { grid-template-columns: repeat(2,1fr); }
  .two-col { grid-template-columns: 1fr; }
  .chart-grid { grid-template-columns: 1fr; }
}

  .hamburger { display: flex; }

  .page-title { font-size: 1.5rem; }

}
@media (max-width: 480px) {
  .kpi-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi-card { padding: 16px; }
  .kpi-num { font-size: 1.5rem; }

  .modal-body { grid-template-columns: 1fr; }

}

  .kpi-grid { grid-template-columns: 1fr; }
  .clients-grid { grid-template-columns: 1fr; }
}

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ===== DATA =====
const COLORS = ['#3FBFA8','#9B8FD4','#E8A84A','#E8604A','#D4A853'];
let apts = [
  {id:1,name:"Emily Clarke",email:"emily@c.com",phone:"+1 555 1234",service:"Consultation",date:"2026-05-18",time:"10:00",status:"Confirmed",notes:""},
  {id:2,name:"James Wilson",email:"james@c.com",phone:"+1 555 5678",service:"Hair Styling",date:"2026-05-19",time:"14:30",status:"Pending",notes:""},
  {id:3,name:"Sophia Martinez",email:"sophia@c.com",phone:"+1 555 9999",service:"Gym Session",date:"2026-05-20",time:"09:00",status:"Confirmed",notes:""},
  {id:4,name:"Michael Brown",email:"michael@c.com",phone:"+1 555 7777",service:"Medical Check",date:"2026-05-21",time:"11:15",status:"Cancelled",notes:""},
  {id:5,name:"Olivia Johnson",email:"olivia@c.com",phone:"+1 555 2222",service:"Consultation",date:"2026-05-22",time:"15:45",status:"Pending",notes:""},
  {id:6,name:"Daniel Park",email:"daniel@c.com",phone:"+1 555 3333",service:"Gym Session",date:"2026-05-23",time:"08:00",status:"Confirmed",notes:""}
];
let nid = 7;
let active = "dashboard";
let calInst = null;
let editId = null;
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();

const view = document.getElementById("view");
const modal = document.getElementById("modal");
const ham = document.getElementById("ham");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

// ===== HELPERS =====
function initials(n){ return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function avatarColor(n){ let h=0; for(let c of n) h=(h*31+c.charCodeAt(0))%COLORS.length; return COLORS[h]; }
function statusClass(s){ return s.toLowerCase(); }

// ===== STYLED TOAST =====
function showToast(msg, type='success', title=null) {
  const icons = { success:'fas fa-check-circle', error:'fas fa-times-circle', warning:'fas fa-exclamation-triangle', info:'fas fa-info-circle' };
  const titles = { success: title||'Success', error: title||'Error', warning: title||'Warning', info: title||'Info' };
  const container = document.getElementById("toastContainer");
  const t = document.createElement("div");
  t.className = `toast ${type}`;
  t.style.position = 'relative';
  t.innerHTML = `
    <div class="toast-left-bar"></div>
    <div class="toast-icon"><i class="${icons[type]}"></i></div>
    <div class="toast-text">
      <div class="toast-title">${titles[type]}</div>
      <div class="toast-msg">${msg}</div>
    </div>
    <button class="toast-close" onclick="hideToast(this.parentElement)"><i class="fas fa-times"></i></button>
    <div class="toast-progress"></div>
  `;
  container.appendChild(t);
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>t.classList.add('show')); });
  const timer = setTimeout(()=>hideToast(t), 3200);
  t._timer = timer;
}
function hideToast(t) {
  clearTimeout(t._timer);
  t.classList.add('hiding');
  setTimeout(()=>{ if(t.parentElement) t.parentElement.removeChild(t); }, 350);
}

function updateBadge(){
  document.getElementById("pendingBadge").textContent = apts.filter(a=>a.status==="Pending").length;
}

// ===== NAV =====
document.querySelectorAll(".nav-item").forEach(el=>{
  el.addEventListener("click",()=>{
    active = el.dataset.s;
    document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
    el.classList.add("active");
    render();
    if(window.innerWidth<768){ sidebar.classList.remove("open"); overlay.classList.remove("active"); }
  });
});
ham.addEventListener("click",()=>{
  sidebar.classList.toggle("open");
  overlay.classList.toggle("active");
});
overlay.addEventListener("click",()=>{ sidebar.classList.remove("open"); overlay.classList.remove("active"); });

// ===== MODAL =====
document.getElementById("openModal").addEventListener("click",()=>{
  editId = null;
  document.getElementById("modalSubmit").textContent = "Confirm Booking";
  document.getElementById("modalTitle").textContent = "New Appointment";
  document.getElementById("modalSub").textContent = "Fill in the details below to schedule";
  clearForm();
  modal.style.display = "flex";
});
document.getElementById("closeModal").addEventListener("click",()=>{ modal.style.display="none"; });
window.addEventListener("click",e=>{ if(e.target===modal) modal.style.display="none"; });
document.getElementById("modalSubmit").addEventListener("click",()=>handleSubmit());

function clearForm(){
  ["fName","fEmail","fPhone","fDate","fTime","fNotes"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("fService").selectedIndex = 0;
}
function handleSubmit(){
  const name = document.getElementById("fName").value.trim();
  const date = document.getElementById("fDate").value;
  const time = document.getElementById("fTime").value;
  if(!name||!date||!time){ showToast("Name, date and time are required","warning","Incomplete Form"); return; }
  const data = {
    name, date, time,
    email: document.getElementById("fEmail").value,
    phone: document.getElementById("fPhone").value,
    service: document.getElementById("fService").value,
    notes: document.getElementById("fNotes").value,
    status: "Pending"
  };
  if(editId){
    const idx = apts.findIndex(a=>a.id===editId);
    if(idx>-1){ apts[idx] = {...apts[idx],...data}; }
    showToast(`${name}'s appointment updated`, "info", "Appointment Updated");
  } else {
    apts.push({id:nid++,...data});
    showToast(`${name} booked successfully`, "success", "Booking Confirmed");
  }
  modal.style.display = "none";
  updateBadge();
  render();
}
function openEdit(id){
  const a = apts.find(x=>x.id===id); if(!a) return;
  editId = id;
  document.getElementById("fName").value = a.name;
  document.getElementById("fEmail").value = a.email;
  document.getElementById("fPhone").value = a.phone;
  document.getElementById("fService").value = a.service;
  document.getElementById("fDate").value = a.date;
  document.getElementById("fTime").value = a.time;
  document.getElementById("fNotes").value = a.notes;
  document.getElementById("modalTitle").textContent = "Edit Appointment";
  document.getElementById("modalSub").textContent = "Update the appointment details";
  document.getElementById("modalSubmit").textContent = "Save Changes";
  modal.style.display = "flex";
}
function deleteApt(id){
  const a = apts.find(x=>x.id===id);
  apts = apts.filter(a=>a.id!==id);
  updateBadge(); render();
  showToast(`${a?a.name+"'s appointment":""} removed`, "error", "Appointment Removed");
}

// ===== RENDER =====
function render(){
  if(calInst){ calInst.destroy(); calInst=null; }
  const sections = {
    dashboard: renderDash,
    appointments: renderApts,
    calendar: renderCal,
    clients: renderClients,
    analytics: renderAnalytics,
    messages: renderMessages,
    settings: renderSettings
  };
  (sections[active] || renderDash)();
  updateBadge();
}

// ===== MINI CAL =====
function miniCal(){
  const today = new Date();
  const aptDates = new Set(apts.map(a=>a.date));
  const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const days=["Su","Mo","Tu","We","Th","Fr","Sa"];
  const first = new Date(calYear,calMonth,1).getDay();
  const daysInMonth = new Date(calYear,calMonth+1,0).getDate();
  const prev = new Date(calYear,calMonth,0).getDate();
  let cells=''; let d=1;
  for(let r=0;r<6;r++){
    for(let c=0;c<7;c++){
      const idx=r*7+c;
      let day, other=false;
      if(idx<first){ day=prev-(first-idx-1); other=true; }
      else if(d>daysInMonth){ day=d-daysInMonth; d++; other=true; }
      else { day=d++; }
      const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const isToday=!other&&calYear===today.getFullYear()&&calMonth===today.getMonth()&&day===today.getDate();
      const hasApt=!other&&aptDates.has(dateStr);
      cells+=`<div class="cal-day${other?' other-month':''}${isToday?' today':''}${hasApt?' has-apt':''}">${day}</div>`;
    }
    if(d>daysInMonth&&r>3) break;
  }
  return `<div class="mini-cal">
    <div class="mini-cal-header">
      <div class="mini-cal-title">${months[calMonth]} ${calYear}</div>
      <div class="mini-cal-nav">
        <button class="cal-nav-btn" id="calPrev"><i class="fas fa-chevron-left"></i></button>
        <button class="cal-nav-btn" id="calNext"><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
    <div class="mini-cal-grid">
      ${days.map(d=>`<div class="cal-day-name">${d}</div>`).join('')}
      ${cells}
    </div>
  </div>`;
}

// ===== DASHBOARD =====

  view.innerHTML=`
  <div class="page-header">
    <div>
      <div class="page-title">Good morning, <span>Alex</span> 👋</div>
      <div class="page-sub">Here's what's happening with your appointments today</div>
    </div>
  </div>

  <div class="kpi-grid">
    ${[
      {icon:'fas fa-calendar-alt',col:'var(--gold)',dim:'var(--gold-dim)',num:total,label:'Total Appointments',change:'up',txt:'14% this month'},
      {icon:'fas fa-hourglass-half',col:'var(--amber)',dim:'var(--amber-dim)',num:pending,label:'Pending Bookings',change:'neutral',txt:'Awaiting review'},
      {icon:'fas fa-check-circle',col:'var(--teal)',dim:'var(--teal-dim)',num:confirmed,label:'Confirmed Sessions',change:'up',txt:'+5 vs last week'},
      {icon:'fas fa-dollar-sign',col:'var(--lavender)',dim:'var(--lavender-dim)',num:'$'+revenue,label:'Revenue Generated',change:'up',txt:'+22% growth'}
    ].map((k,i)=>`
    <div class="kpi-card" style="--accent-col:${k.col};animation-delay:${(i+1)*0.05}s">
      <div class="kpi-top">
        <div class="kpi-icon" style="background:${k.dim};color:${k.col}"><i class="${k.icon}"></i></div>
        <div class="kpi-change ${k.change}">${k.change==='up'?'↑':k.change==='down'?'↓':'—'} ${k.txt}</div>
      </div>
      <div class="kpi-num">${k.num}</div>
      <div class="kpi-label">${k.label}</div>
    </div>`).join('')}
  </div>

  <div class="two-col">
    <div class="card">
      <div class="card-head">
        <div class="card-head-title"><i class="fas fa-clock"></i>Upcoming Appointments</div>
        <div class="card-head-action" onclick="document.querySelector('[data-s=appointments]').click()">View all</div>
      </div>
      ${upcoming.map(a=>`
      <div class="app-row">
        <div class="app-avatar" style="background:${avatarColor(a.name)}">${initials(a.name)}</div>
        <div class="app-info">
          <div class="app-name">${a.name}</div>
          <div class="app-service">${a.service}</div>
        </div>
        <div style="text-align:right">
          <div class="app-time">${a.time}</div>
          <div class="app-date">${a.date}</div>
          <div style="margin-top:5px"><span class="pill ${statusClass(a.status)}">${a.status}</span></div>
        </div>
      </div>`).join('')}
    </div>

    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card">
        <div class="card-head"><div class="card-head-title"><i class="far fa-calendar"></i>Calendar</div></div>
        ${miniCal()}
      </div>
      <div class="card">
        <div class="card-head"><div class="card-head-title"><i class="fas fa-chart-pie"></i>Service Mix</div></div>
        ${['Consultation','Hair Styling','Gym Session','Medical Check'].map((s,i)=>{
          const cnt=apts.filter(a=>a.service===s).length;
          const pct=total>0?Math.round(cnt/total*100):0;
          return `<div class="stat-mini">
            <div class="stat-mini-icon" style="background:${COLORS[i]}20;color:${COLORS[i]}">${['📋','✂️','🏋️','🩺'][i]}</div>
            <div style="min-width:80px">
              <div class="stat-mini-val" style="color:${COLORS[i]}">${cnt}</div>
              <div class="stat-mini-lbl">${s}</div>
            </div>
            <div style="flex:1"><div class="stat-mini-bar"><div class="stat-mini-bar-fill" style="width:${pct}%;background:${COLORS[i]}"></div></div></div>
            <span style="font-size:0.72rem;font-weight:700;color:var(--cream-mute);min-width:30px;text-align:right">${pct}%</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>

  <div class="sec-title"><div class="sec-title-line"></div>Recent Bookings</div>
  <div class="table-wrap">
    <table class="data-table">
      <thead><tr><th>Client</th><th>Service</th><th>Date & Time</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${[...apts].reverse().slice(0,5).map(a=>`<tr>
        <td>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="app-avatar" style="width:34px;height:34px;border-radius:9px;font-size:0.72rem;background:${avatarColor(a.name)}">${initials(a.name)}</div>
            <div><div class="td-primary">${a.name}</div><div class="td-sub">${a.email}</div></div>
          </div>
        </td>
        <td style="color:var(--cream-dim)">${a.service}</td>
        <td><div class="td-primary">${a.date}</div><div class="td-sub">${a.time}</div></td>
        <td><span class="pill ${statusClass(a.status)}">${a.status}</span></td>
        <td><div style="display:flex;gap:6px">
          <button class="action-btn editBtn" data-id="${a.id}" title="Edit"><i class="fas fa-pen"></i></button>
          <button class="action-btn del delBtn" data-id="${a.id}" title="Delete"><i class="fas fa-trash-alt"></i></button>
        </div></td>
      </tr>`).join('')}</tbody>
    </table>
  </div>`;
  attachTableEvents();
  document.getElementById("calPrev")?.addEventListener("click",()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} render(); });
  document.getElementById("calNext")?.addEventListener("click",()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} render(); });
}

// ===== APPOINTMENTS TABLE =====
function renderApts(search='', statusF=''){
  let rows = apts.filter(a=>{
    const s = search.toLowerCase();
    return (!s||(a.name.toLowerCase().includes(s)||a.service.toLowerCase().includes(s)))&&(!statusF||a.status===statusF);
  });
  view.innerHTML=`
  <div class="page-header">
    <div>
      <div class="page-title">Appointments</div>
      <div class="page-sub">${apts.length} total · ${apts.filter(a=>a.status==='Pending').length} pending</div>
    </div>
  </div>
  <div class="filter-bar">
    <input class="filter-input" id="fSearch" type="text" placeholder="🔍 Search client or service..." value="${search}" style="flex:1;min-width:180px;max-width:320px">
    <select class="filter-input" id="fStatus">
      <option value="">All Status</option>
      <option${statusF==='Confirmed'?' selected':''}>Confirmed</option>
      <option${statusF==='Pending'?' selected':''}>Pending</option>
      <option${statusF==='Cancelled'?' selected':''}>Cancelled</option>
    </select>
  </div>
  <div class="table-wrap">
    <table class="data-table">
      <thead><tr><th>Client</th><th>Service</th><th>Date</th><th>Time</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        ${rows.length ? rows.map(a=>`<tr>
          <td>
            <div style="display:flex;align-items:center;gap:10px">
              <div class="app-avatar" style="width:36px;height:36px;border-radius:10px;font-size:0.78rem;background:${avatarColor(a.name)}">${initials(a.name)}</div>
              <div><div class="td-primary">${a.name}</div><div class="td-sub">${a.phone}</div></div>
            </div>
          </td>
          <td style="color:var(--cream-dim)">${a.service}</td>
          <td class="td-primary">${a.date}</td>
          <td class="td-primary">${a.time}</td>
          <td><span class="pill ${statusClass(a.status)}">${a.status}</span></td>
          <td><div style="display:flex;gap:6px">
            <button class="action-btn editBtn" data-id="${a.id}"><i class="fas fa-pen"></i></button>
            <button class="action-btn del delBtn" data-id="${a.id}"><i class="fas fa-trash-alt"></i></button>
          </div></td>
        </tr>`).join('') : `<tr><td colspan="6"><div class="empty-state"><i class="fas fa-calendar-times"></i><p>No appointments found</p></div></td></tr>`}
      </tbody>
    </table>
  </div>`;
  document.getElementById("fSearch")?.addEventListener("input",e=>renderApts(e.target.value, document.getElementById("fStatus").value));
  document.getElementById("fStatus")?.addEventListener("change",e=>renderApts(document.getElementById("fSearch").value, e.target.value));
  attachTableEvents();
}

function attachTableEvents(){
  document.querySelectorAll(".editBtn").forEach(b=>b.addEventListener("click",()=>openEdit(+b.dataset.id)));
  document.querySelectorAll(".delBtn").forEach(b=>b.addEventListener("click",()=>deleteApt(+b.dataset.id)));
}

// ===== CALENDAR =====
function renderCal(){
  view.innerHTML=`
  <div class="page-header"><div><div class="page-title">Calendar</div><div class="page-sub">Visual overview of all appointments</div></div></div>
  <div style="background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);padding:20px;overflow:hidden" id="fc"></div>`;
  setTimeout(()=>{
    const el=document.getElementById("fc"); if(!el) return;
    calInst=new FullCalendar.Calendar(el,{
      initialView:'dayGridMonth',
      events:apts.map(a=>({title:`${a.name} · ${a.service}`,start:`${a.date}T${a.time}`,backgroundColor:avatarColor(a.name),borderColor:'transparent',textColor:'white'})),
      headerToolbar:{left:'prev,next today',center:'title',right:'dayGridMonth,timeGridWeek'},
    });
    calInst.render();
  },50);
}

// ===== ANALYTICS =====
function renderAnalytics(){
  const svc={'Consultation':0,'Hair Styling':0,'Gym Session':0,'Medical Check':0};
  apts.forEach(a=>{ if(svc[a.service]!==undefined) svc[a.service]++; });
  view.innerHTML=`
  <div class="page-header"><div><div class="page-title">Analytics</div><div class="page-sub">Performance overview and trends</div></div></div>
  <div class="chart-grid">
    <div class="chart-card">
      <div class="card-head"><div class="card-head-title"><i class="fas fa-chart-line"></i>Booking Trend</div></div>
      <div class="chart-body"><canvas id="lineC" height="110"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="card-head"><div class="card-head-title"><i class="fas fa-chart-pie"></i>Service Breakdown</div></div>
      <div class="chart-body"><canvas id="pieC" height="150"></canvas></div>
    </div>
  </div>
  <div class="chart-card" style="margin-top:20px">
    <div class="card-head"><div class="card-head-title"><i class="fas fa-chart-bar"></i>Service Popularity</div></div>
    <div class="chart-body"><canvas id="barC" height="70"></canvas></div>
  </div>`;
  const co={responsive:true,plugins:{legend:{labels:{font:{family:'Instrument Sans'},color:'rgba(242,236,216,0.5)',boxWidth:12,padding:16}}}};
  const gc={'#': theme => `rgba(${parseInt(theme.slice(1,3),16)},${parseInt(theme.slice(3,5),16)},${parseInt(theme.slice(5,7),16)},0.15)`};
  new Chart(document.getElementById("lineC"),{type:'line',data:{labels:['Week 1','Week 2','Week 3','Week 4'],datasets:[{label:'Bookings',data:[4,8,11,apts.length],borderColor:'#D4A853',backgroundColor:'rgba(212,168,83,0.08)',tension:0.4,fill:true,pointBackgroundColor:'#D4A853',pointRadius:5,pointHoverRadius:7}]},options:{...co,scales:{y:{beginAtZero:true,grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'rgba(242,236,216,0.4)',font:{family:'Instrument Sans'}}},x:{grid:{display:false},ticks:{color:'rgba(242,236,216,0.4)',font:{family:'Instrument Sans'}}}}}});
  new Chart(document.getElementById("pieC"),{type:'doughnut',data:{labels:Object.keys(svc),datasets:[{data:Object.values(svc),backgroundColor:COLORS,borderWidth:0,hoverOffset:6}]},options:{...co,cutout:'68%'}});
  new Chart(document.getElementById("barC"),{type:'bar',data:{labels:Object.keys(svc),datasets:[{label:'Count',data:Object.values(svc),backgroundColor:COLORS,borderRadius:10,borderSkipped:false}]},options:{...co,scales:{y:{beginAtZero:true,grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'rgba(242,236,216,0.4)',font:{family:'Instrument Sans'}}},x:{grid:{display:false},ticks:{color:'rgba(242,236,216,0.4)',font:{family:'Instrument Sans'}}}}}});
}

document.getElementById("globalSearch")?.addEventListener("input",e=>{
